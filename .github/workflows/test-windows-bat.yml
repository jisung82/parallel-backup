name: Test Windows BAT

on:
  push:
    paths:
      - "ParallelBackup.bat"
      - "app.py"
      - "parallel_backup_launcher.py"
      - "backup_engine.py"
      - "tests/**"
      - ".github/workflows/test-windows-bat.yml"
  pull_request:
    paths:
      - "ParallelBackup.bat"
      - "app.py"
      - "parallel_backup_launcher.py"
      - "backup_engine.py"
      - "tests/**"
      - ".github/workflows/test-windows-bat.yml"
  workflow_dispatch:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Inspect Python
        shell: cmd
        run: |
          echo ==== where python.exe ====
          where python.exe || exit /b 0
          echo ==== where py.exe ====
          where py.exe || exit /b 0
          echo ==== python version ====
          python --version || exit /b 0
          echo ==== py version ====
          py -3 --version || exit /b 0

      - name: Install static test tools
        shell: cmd
        run: |
          py -3 -m pip install --disable-pip-version-check pytest pyflakes

      - name: Test launcher
        shell: cmd
        run: |
          set PARALLEL_BACKUP_TEST=1
          call ParallelBackup.bat

      - name: Verify all Python syntax
        shell: cmd
        run: |
          py -3 -m py_compile app.py
          py -3 -m py_compile parallel_backup_launcher.py
          py -3 -m compileall -q tests

      - name: Run regression tests
        shell: cmd
        run: |
          py -3 -m pytest -q tests

      - name: Check undefined names in all project Python
        shell: cmd
        run: |
          py -3 -m pyflakes app.py parallel_backup_launcher.py tests
